[package]
name = "synthetix"
version = "0.1.1"
edition = "2021"
description = "CPU-friendly extractive summarizer based on Doc2Vec, HNSW and graph centrality"
default-run = "synthetix"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
hnsw_rs = "0.3"
kneed = "1.0"
pdf-extract = "0.7"
rand = "0.8"
rayon = "1.10"
regex = "1.11"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
